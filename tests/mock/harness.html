<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Playlist Labels mock</title>
<!--
  A minimal stand-in for Spotify 1.3's track list DOM: no legacy
  main-trackList-* classes, rows found by ARIA roles, row templates in a
  --grid-template-columns variable and track URIs only in React fiber props.
  Built by run.mjs; see docs/testing.md.
-->
<style>
    body { margin: 0; background: #121212; color: #fff; font: 14px sans-serif; }
    .Root__main-view { width: var(--main-view-width, 1500px); padding: 16px; }
    [role=grid] { --grid-template-columns: [index] 16px [first] minmax(120px, 4fr) [var1] minmax(120px, 2fr) [var2] minmax(120px, 2fr) [last] minmax(120px, 1fr); }
    [role=grid].collaborative { --grid-template-columns: [index] 16px [first] minmax(120px, 4fr) [var1] minmax(120px, 2fr) [var2] minmax(120px, 2fr) [var3] minmax(120px, 2fr) [last] minmax(120px, 1fr); }
    [role=grid].artist { --grid-template-columns: [index] 16px [first] minmax(120px, 4fr) [var1] minmax(120px, 2fr) [last] minmax(120px, 1fr); }
    .row-grid { display: grid; grid-template-columns: var(--grid-template-columns); grid-gap: 16px; height: 56px; align-items: center; border-bottom: 1px solid #333; }
    .row-grid > * { min-width: 0; overflow: hidden; }
    .cover { width: 40px; height: 40px; border-radius: 4px; background: #555; }
</style>
</head>
<body>
<div class="Root__main-view"><main></main></div>
</body>
</html>
